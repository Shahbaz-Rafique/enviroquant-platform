[project]
name = "enviroquant-backend"
version = "0.1.0"
description = "FastAPI backend for the EnviroQuant MVP foundation"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "bcrypt>=4.0.0,<4.1.0",
    "email-validator>=2.1.0",
    "fastapi>=0.115.0",
    "cloudinary>=1.40.0",
    "openai>=1.54.0",
    "passlib[bcrypt]>=1.7.4",
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
    "Pillow>=10.0.0",
    "psycopg[binary]>=3.1.18",
    "pydantic-settings>=2.2.1",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.2.5",
    "sqlalchemy>=2.0.25",
    "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
