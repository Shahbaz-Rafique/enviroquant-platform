services:
  postgres:
    image: postgres:16-alpine
    container_name: enviroquant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: enviroquant
      POSTGRES_USER: enviroquant
      POSTGRES_PASSWORD: enviroquant
    ports:
      - "5432:5432"
    volumes:
      - enviroquant_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enviroquant -d enviroquant"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend
    container_name: enviroquant-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://neondb_owner:npg_7lxEFohdL2qj@ep-summer-bonus-aj9ydkpa-pooler.c-3.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
      FRONTEND_APP_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ./frontend
    container_name: enviroquant-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  enviroquant_postgres_data:
