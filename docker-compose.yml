services:
  postgres:
    image: postgres:16-alpine
    container_name: enviroquant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: enviroquant
      POSTGRES_USER: enviroquant
      POSTGRES_PASSWORD: enviroquant
    ports:
      - "5432:5432"
    volumes:
      - enviroquant_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enviroquant -d enviroquant"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  enviroquant_postgres_data:
